# Gegenereerd met npm run build:rulesets. Zie docs/BESLUITEN.md.
extends:
  - "spectral:oas"
functionsDir: "./functions"
functions:
  - "normoOas"
rules:
  tool-oas-supported-version:
    description: "ID23: Ondersteunde OpenAPI dialecten."
    documentationUrl: "https://hetnormo.github.io/API-standards/api-design-rules/"
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: true
    then:
      function: normoOas
      functionOptions:
        check: "document"
  normo-api-info:
    description: "ID07: Volledigheid van API metadata."
    documentationUrl: "https://hetnormo.github.io/API-standards/api-design-rules/#id-07---definition-of-attributes-info-object"
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: true
    then:
      function: normoOas
      functionOptions:
        check: "info"
  normo-api-version:
    description: "ID02: Semantisch versienummer."
    documentationUrl: "https://hetnormo.github.io/API-standards/api-design-rules/#id-02---version-management"
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: true
    then:
      function: normoOas
      functionOptions:
        check: "version"
  normo-api-release-date:
    description: "ID07: Bestaande kalenderdatum."
    documentationUrl: "https://hetnormo.github.io/API-standards/api-design-rules/#id-07---definition-of-attributes-info-object"
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: true
    then:
      function: normoOas
      functionOptions:
        check: "releaseDate"
  tool-api-operation-kind:
    description: "ID08: Geldigheid van lokale operationele classificatie."
    documentationUrl: "https://hetnormo.github.io/API-standards/api-design-rules/#id-08---use-of-rest-operations"
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: true
    then:
      function: normoOas
      functionOptions:
        check: "operationKind"
  normo-api-status-codes:
    description: "ID10: Expliciete minimale responscodes."
    documentationUrl: "https://hetnormo.github.io/API-standards/api-design-rules/#id-10---http-status-codes"
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: true
    then:
      function: normoOas
      functionOptions:
        check: "statusCodes"
  normo-api-get-no-body:
    description: "ID08: GET bevat geen requestbody."
    documentationUrl: "https://hetnormo.github.io/API-standards/attachments/Use-of-HTTP-operations-for-RESTful-APIs.html#get-operation"
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: true
    then:
      function: normoOas
      functionOptions:
        check: "getBody"
